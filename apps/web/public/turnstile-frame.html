<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta content="width=device-width, initial-scale=1" name="viewport">
		<meta content="noindex, nofollow" name="robots">
		<style>
		* {
			box-sizing: border-box;
		}
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: transparent;
		}
		#widget {
			width: 300px;
			min-height: 65px;
		}
		body.compact #widget {
			width: 150px;
			min-height: 140px;
		}
		</style>
	</head>
	<body>
		<div id="widget"></div>
		<script>
		"use strict";
		const params = new URLSearchParams(location.search);
		const nonce = params.get("nonce") || "";
		const sitekey = params.get("sitekey") || "";
		const action = (params.get("action") || "multiplayer_entry")
			.replace(/[^a-zA-Z0-9_-]/g, "")
			.slice(0, 32);
		const compact = params.get("size") === "compact";
		if (compact) {
			document.body.classList.add("compact");
		}
		const send = (type, detail = {}) =>
			parent.postMessage(
				{
					nonce,
					source: "pf-turnstile-frame",
					type,
					...detail,
				},
				location.origin
			);
		window.turnstileReady = () => {
			try {
				const widget = turnstile.render("#widget", {
					action,
					"after-interactive-callback": () => send("after-interactive"),
					appearance: "always",
					"before-interactive-callback": () => send("before-interactive"),
					callback: (token) => send("success", { token }),
					"error-callback": (code) =>
						send("error", { code: String(code || "") }),
					execution: "execute",
					"expired-callback": () => send("expired"),
					"refresh-timeout": "auto",
					"response-field": false,
					retry: "auto",
					"retry-interval": 2000,
					sitekey,
					size: compact ? "compact" : "normal",
					theme: "light",
					"timeout-callback": () => send("timeout"),
					"unsupported-callback": () => send("unsupported"),
				});
				send("rendered", { widget });
				turnstile.execute(widget);
				send("executed", { widget });
			} catch (error) {
				send("exception", {
					message: error instanceof Error ? error.message : String(error),
				});
			}
		};
		send("frame-ready");
		</script>
		<script
			async
			defer
			onerror="send('script-error')"
			src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=turnstileReady"
		></script>
	</body>
</html>
